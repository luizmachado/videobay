# Daily merge of yt-dlp upstream into this fork (ADR-0002). Pushes only when the GUI CI stays green.
name: videobay-upstream-sync
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  videobay-upstream-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          # WHY: upstream merges often touch .github/workflows/*, and GITHUB_TOKEN may not push those.
          # Needs a fine-grained PAT with "Contents" and "Workflows" write on this fork only.
          token: ${{ secrets.VIDEOBAY_UPSTREAM_SYNC_TOKEN }}
      - name: Merge upstream/master
        run: |
          git config user.name "videobay-upstream-sync"
          git config user.email "videobay-upstream-sync@users.noreply.github.com"
          git remote add upstream https://github.com/yt-dlp/yt-dlp
          git fetch upstream master --tags
          git merge --no-edit upstream/master
      - uses: astral-sh/setup-uv@v6
      - run: make -C videobay_gui ci
      - run: git push origin HEAD:master --follow-tags
